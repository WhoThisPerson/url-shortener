name: CI Build
on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      # # -------------------------------------------------------------
      # # Install dependencies and run tests for the frontend
      # # -------------------------------------------------------------
      # TBA
      
      # -------------------------------------------------------------
      # Install dependencies and run tests for the backend
      # -------------------------------------------------------------
      - name: Install Backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Start PostgreSQL
        run: docker compose up -d
      
      - name: Wait for PostgreSQL to be ready
        run: |
          until docker exec url-shortener-db pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
            echo "waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Run database migrations
        working-directory: ./backend
        run: |
          docker exec -i url-shortener-db psql \
            -U "$POSTGRES_USER" \
            -d "$POSTGRES_DB" \
            < migrations/001_create_tables.sql

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test
